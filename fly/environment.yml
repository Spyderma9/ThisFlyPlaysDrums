# Server environment. Conda-forge for the scientific stack; PyTorch from its own pip wheels (CUDA 12.6),
# the same way fly-brain installs it. The `pytorch` conda channel stopped at 2.5 and clashes with newer MKL.
# The Xeons have AVX but not AVX2: check `import torch, mujoco` after any change here.
# fly-brain itself is cloned to fly/vendor/fly-brain and imported from there (see fly/brain.py).
name: flydrums
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4  # fly-brain's pin
  - pandas
  - pyarrow
  - scipy
  - scikit-learn
  - pyzmq
  - mido
  - matplotlib
  - tqdm
  - pytest
  - ffmpeg  # fly.clip's MP4s. The live server has it in a separate env (FFMPEG=.../envs/media/bin/ffmpeg).
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch
      - snntorch
      - dm_control
      - git+https://github.com/TuragaLab/flybody.git
