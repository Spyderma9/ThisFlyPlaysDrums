# Server environment. Conda builds avoid "Illegal instruction" crashes on the Xeons (no AVX2).
# fly-brain itself is cloned to fly/vendor/fly-brain and imported from there (see fly/brain.py).
name: flydrums
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - numpy
  - pandas
  - pyarrow
  - scikit-learn
  - pytorch
  - pytorch-cuda=12.1
  - mujoco
  - pyzmq
  - mido
  - matplotlib
  - python-dotenv
  - pytest
  - pip
  - pip:
      - neuprint-python
      - snntorch
      - dm_control
      - git+https://github.com/TuragaLab/flybody.git
